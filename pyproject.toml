[project]
name = "ope"
version = "0.1.0"
description = "Propensity and next-best-action engine on the Orange KDD Cup 2009 data"
authors = [{ name = "Mrwan Awad" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "polars",
    "pyarrow",
    "pyyaml",
    "pydantic>=2",
    "scikit-learn",
    "lightgbm",
    "xgboost",
    "catboost",
    "optuna",
    "shap",
    "pandera[polars]",
    "wandb",
    "openml",
    "ortools",
    "redis",
    "fastapi",
    "uvicorn[standard]",
    "pyjwt[crypto]",
    "prometheus-client",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-exporter-otlp-proto-http",
    "dash",
    "gunicorn",
    "plotly",
    "matplotlib",
    "httpx",
    "python-dotenv",
]

[project.optional-dependencies]
spark = ["pyspark==4.1.4", "pyiceberg[pyarrow,s3fs]"]
monitoring = ["nannyml", "statsmodels"]
h2o = ["h2o"]
agent = ["agent-framework-core", "agent-framework-anthropic", "fastmcp", "langsmith[otel]"]
feast = ["feast[redis]"]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "pyright",
    "pre-commit",
    "fakeredis",
    "locust",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ope"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Security"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false
reportAttributeAccessIssue = "warning"
reportArgumentType = "warning"
reportCallIssue = "warning"
reportOptionalMemberAccess = "warning"
reportReturnType = "warning"
reportIndexIssue = "warning"
reportPossiblyUnbound = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs the real dataset or long training",
    "integration: needs docker services",
]
addopts = "-q"

[tool.uv]
# nannyml pulls kaleido; 0.2.1.post1 has no Windows wheel
constraint-dependencies = ["kaleido!=0.2.1.post1"]
