apiVersion: apps/v1
kind: Deployment
metadata:
  name: ope-api
  labels:
    {{- include "ope.labels" . | nindent 4 }}
    app.kubernetes.io/name: ope-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: ope-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ope-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      {{- include "ope.artifactSync" . | nindent 6 }}
      containers:
        - name: api
          image: {{ .Values.image.api }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 8000, name: http }]
          envFrom:
            - configMapRef: { name: ope-config }
            - secretRef: { name: {{ .Values.api.apiKeysSecret }}, optional: true }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false }
          volumeMounts:
            {{- include "ope.artifactMounts" . | nindent 12 }}
      volumes:
        {{- include "ope.artifactVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ope-api
  labels: {{- include "ope.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: ope-api }
  ports: [{ port: 80, targetPort: http, name: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ope-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: ope-api }
{{- if .Values.api.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ope-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ope-api }
  minReplicas: {{ .Values.api.hpa.min }}
  maxReplicas: {{ .Values.api.hpa.max }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.api.hpa.cpu }} }
{{- end }}
