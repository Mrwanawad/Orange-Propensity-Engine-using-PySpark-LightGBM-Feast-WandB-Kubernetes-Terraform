{{- if .Values.console.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ope-console
  labels: {{- include "ope.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: ope-console }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ope-console }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      {{- include "ope.artifactSync" . | nindent 6 }}
      containers:
        - name: console
          image: {{ .Values.image.api }}
          command: ["gunicorn", "-b", "0.0.0.0:8050", "-w", "2", "ope.console.app:server"]
          ports: [{ containerPort: 8050, name: http }]
          env:
            - { name: OPE_API_URL, value: "http://ope-api" }
            - name: OPE_API_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.api.apiKeysSecret }}, key: CONSOLE_KEY, optional: true }
          readinessProbe:
            httpGet: { path: /, port: http }
          volumeMounts:
            {{- include "ope.artifactMounts" . | nindent 12 }}
      volumes:
        {{- include "ope.artifactVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ope-console
spec:
  selector: { app.kubernetes.io/name: ope-console }
  ports: [{ port: 80, targetPort: http }]
{{- end }}
