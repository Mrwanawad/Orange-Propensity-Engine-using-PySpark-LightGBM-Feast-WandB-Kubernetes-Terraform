apiVersion: v1
kind: ConfigMap
metadata:
  name: ope-config
  labels: {{- include "ope.labels" . | nindent 4 }}
data:
  REDIS_URL: {{ .Values.redis.url | quote }}
  OPE_RATE_LIMIT_PER_MINUTE: {{ .Values.api.rateLimitPerMinute | quote }}
  OPE_JWT_ISSUER: {{ .Values.api.jwt.issuer | quote }}
  OPE_JWT_AUDIENCE: {{ .Values.api.jwt.audience | quote }}
  OPE_JWKS_URL: {{ .Values.api.jwt.jwksUrl | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.api.otlpEndpoint | quote }}
  {{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
